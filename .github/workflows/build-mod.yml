name: Build mod

# Builds the wasm mod end to end on every push: verifies manifests/assets,
# installs cargo-horizon-mod from the pinned SDK commit, compiles mod.wasm,
# packs the .hmod, runs the registry's checks, and executes Rust unit tests.
# The .hmod is published as a workflow artifact, and the build log lands in
# the job summary (and in annotations on failure) so it is readable without
# downloading the raw log archive.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A push supersedes the run still building the same ref: CI minutes go to the
# newest code only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match [package.metadata.horizon] sdk in Cargo.toml.
  HORIZON_SDK_COMMIT: f1bb66f353cf67f2aa4665293fc75c8d91186fc7
  # Single-job compile stays well within the 7 GiB GitHub runner RAM ceiling.
  CARGO_BUILD_JOBS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Verify manifests and assets
        run: python3 tools/verify_assets.py

      # Cargo registry/git index and target/. shared-key pins the cache to the
      # SDK commit (the path dependency set comes from it); the repo has no
      # Cargo.lock for the default key to hash. rust-cache's own restore
      # fallback is safe here: stale crates are re-resolved by Cargo.
      - name: Cache Cargo and build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: horizon-sdk-${{ env.HORIZON_SDK_COMMIT }}

      # Exact-pin caches, no restore-keys on purpose: Horizon requires the
      # tool, the SDK and the wasm toolchain to match the pinned commit
      # byte-for-byte, and a partial fallback would restore a mismatched one
      # silently. On a miss each install/fetch path below rebuilds it safely.

      # rust-cache does not restore installed binaries; cache the tool itself.
      - name: Cache the cargo-horizon-mod binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ runner.os }}-${{ env.HORIZON_SDK_COMMIT }}

      # The SDK fetch from the signed GitHub release; the tool re-verifies the
      # pin in .horizon/sdk/build before using a restored copy.
      - name: Cache the pinned Horizon SDK
        uses: actions/cache@v5
        with:
          path: .horizon/sdk
          key: horizon-sdk-${{ runner.os }}-${{ env.HORIZON_SDK_COMMIT }}

      # The toolchain the tool installs through rustup for the wasm build
      # (with rust-src). The directory name tracks the SDK's pinned toolchain;
      # an SDK bump changes the key and the tool installs the new one.
      - name: Cache the pinned wasm toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu
          key: horizon-wasm-toolchain-${{ runner.os }}-${{ env.HORIZON_SDK_COMMIT }}

      # The wasm-mods doc requires a cargo-horizon-mod built from the same
      # commit as the pinned SDK, or the game refuses the mod's std symbols.
      - name: Install cargo-horizon-mod (pinned SDK commit)
        run: >-
          command -v cargo-horizon-mod >/dev/null 2>&1 ||
          cargo install --locked
          --git https://github.com/horizon-rust/horizon
          --rev "$HORIZON_SDK_COMMIT"
          cargo-horizon-mod

      # Fetches the pinned SDK into .horizon/sdk/, installs the pinned Rust
      # toolchain through rustup, writes mod.wasm and packs the .hmod.
      # pipefail keeps a failed build from passing on tee's exit status.
      - name: Build mod.wasm and pack the .hmod
        shell: bash
        run: set -o pipefail; cargo horizon-mod build --wasm 2>&1 | tee build-log.txt

      - name: Registry check
        shell: bash
        run: set -o pipefail; cargo horizon-mod check target/horizon-mod/just_a_rifle.hmod 2>&1 | tee -a build-log.txt

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          TC=$(ls -1 ~/.rustup/toolchains 2>/dev/null | grep -E '^[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
          if [ -n "$TC" ]; then
            cargo +"$TC" test --lib 2>&1 | tee -a build-log.txt
          else
            cargo test --lib 2>&1 | tee -a build-log.txt
          fi

      - name: Upload the .hmod
        uses: actions/upload-artifact@v6
        with:
          name: just_a_rifle-hmod
          path: target/horizon-mod/just_a_rifle.hmod
          if-no-files-found: error

      - name: Build log to the job summary
        if: always()
        run: |
          {
            echo '### build-log.txt (tail)'
            echo '```text'
            tail -n 400 build-log.txt || echo '(no build log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Actions log downloads go through a host the dev sandbox cannot reach;
      # annotations are served by api.github.com and stay readable everywhere.
      - name: Surface the failure in annotations
        if: failure()
        run: |
          ERRORS=$(grep -n -E "^error|error\[|panicked|refused|denied" build-log.txt | head -n 40)
          TAIL=$(tail -n 40 build-log.txt)
          MSG=$(printf 'errors:\n%s\n\nlog tail:\n%s\n' "$ERRORS" "$TAIL" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::error title=cargo horizon-mod failed::${MSG}"
