[package]
name = "just-a-rifle"
version = "0.9.0"
edition = "2024"
publish = false
license = "MIT"
description = "Just a Rifle — one finely crafted Winchester 1873 lever-action rifle for Horizon"

# The mod API is named by the pinned SDK that `cargo horizon-mod` fetches.
# This path form is the only one the tool and the launcher accept (E_SDK_SOURCE).
[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Referenced by the PayloadCodec derive's fully-qualified macro path.
horizon-mod-api-macros = { path = ".horizon/sdk/api/crates/horizon-mod-api-macros" }

# The build this mod is made for: Nightly 2026-11-22 (f1bb66f).
[package.metadata.horizon]
sdk = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"

# A mod is its own project, not a member of the game's workspace.
[workspace]
